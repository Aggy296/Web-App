apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: uat

spec:
  replicas: 1

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
      - name: web-app

        image: ghcr.io/aggy296/web-app:IMAGE_TAG

        ports:
        - containerPort: 3000

        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"

        env:
        - name: OTEL_SERVICE_NAME
          value: web-app

        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://splunk-otel-collector-agent.observability.svc.cluster.local:4318

        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: http/protobuf

        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://splunk-otel-collector-agent.observability.svc.cluster.local:4318/v1/traces

        - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
          value: http://splunk-otel-collector-agent.observability.svc.cluster.local:4318/v1/metrics

        - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
          value: http://splunk-otel-collector-agent.observability.svc.cluster.local:4318/v1/logs

        - name: OTEL_RESOURCE_ATTRIBUTES
          value: service.name=web-app,deployment.environment=uat

        envFrom:
        - configMapRef:
            name: web-app-config

        - secretRef:
            name: web-app-secret