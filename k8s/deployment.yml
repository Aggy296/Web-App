apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: dev
spec:
  replicas: 2

  selector:
    matchLabels:
      app: orders-api

  template:
    metadata:
      labels:
        app: orders-api

    spec:
      containers:
      - name: orders-api

        image: asia-south1-docker.pkg.dev/web-app-poc-504109/webapp-repo/orders-api:v1

        ports:
        - containerPort: 3000

        resources:
          requests:
            cpu: "10m"
            memory: "16Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"

        env:
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: APP_ENV

        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: APP_NAME

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orders-secret
              key: DB_PASSWORD

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: orders-secret
              key: JWT_SECRET