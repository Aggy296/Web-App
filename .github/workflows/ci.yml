name: Build and Push Pipeline #(CI Pipeline)

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install
        working-directory: ./oders-api

      - name: Run Tests
        run: npm test --if-present
        working-directory: ./oders-api

      - name: Build Docker Image
        run: |
          docker build -t web-app:${{ github.sha }} ./oders-api

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Docker Image
        run: |
          docker tag web-app:${{ github.sha }} ghcr.io/${{ github.repository }}/web-app:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/web-app:${{ github.sha }}